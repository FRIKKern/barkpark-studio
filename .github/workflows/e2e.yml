# Our-side journey specs against Barkpark workspace studio-parity. The Sanity
# side of each spec stays local (needs a Sanity login). Budget: each shard < 60 s
# (aim for 45 s). Six shards on six runners, each on a dataset of its own, leased
# (ci, ci-2 … ci-6; scripts/ci-lease.mjs): one run at a time, the next waits in its
# jobs for free datasets, and nothing is cancelled (a concurrency group per dataset
# cancelled the pending run before it). A second pool (ci-b-*) is ready for two runs at
# once, off until the shards have room under load (CI_LEASE_POOL=wide). Spec files go
# to shards by recorded CI time (scripts/shard-files.mjs, e2e/durations.json), so the
# heavy ones spread; re-record after a big change.
name: e2e
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to the same PR replaces its run (and frees its leases); main's runs, one
# per commit, are never cancelled.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  studio:
    strategy:
      fail-fast: false
      matrix:
        # A new shard is a new required check: add "studio (N, ci-N)" to the ruleset
        # "main: required checks" (docs/decisions/0003), or main won't wait for it.
        # `dataset` names the check and is the shard's first pick from the pool.
        include:
          - { shard: 1, dataset: ci }
          - { shard: 2, dataset: ci-2 }
          - { shard: 3, dataset: ci-3 }
          - { shard: 4, dataset: ci-4 }
          - { shard: 5, dataset: ci-5 }
          - { shard: 6, dataset: ci-6 }
    runs-on: ubuntu-latest
    timeout-minutes: 35 # up to 25 waiting for a dataset, then the run itself (about 5)
    env:
      CI: 'true'
      BARKPARK_URL: https://guerrilla.barkpark.cloud
      BARKPARK_WORKSPACE: studio-parity
      BARKPARK_PROJECT: default
      BARKPARK_TOKEN: ${{ secrets.BARKPARK_TOKEN }} # read/write, studio-parity only
      CI_LEASE_HOLDER: run ${{ github.run_id }}.${{ github.run_attempt }} shard ${{ matrix.shard }}
      BUDGET_NETWORK_SCALE: '4' # runner is far from guerrilla; see e2e/rig/feel.ts
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      # BARKPARK_DATASET: a CI dataset of the pool (GitHub's own; local runs use e2e-*, people use production).
      - name: Lease a CI dataset
        run: node scripts/ci-lease.mjs acquire ${{ matrix.dataset }}
      - run: pnpm --dir app install --frozen-lockfile && pnpm --dir e2e install --frozen-lockfile
      # The studio reads the schemas from Barkpark, as in production (a member token may,
      # barkpark #22080). A PR that changes the fixture schemas tests them from the
      # checkout instead: the pool's datasets only get them when someone reseeds (--schemas, each of ci-lease.mjs POOL).
      - name: Schemas from the fixtures when this PR changes them
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          if [ -n "$(git diff --name-only FETCH_HEAD HEAD -- fixtures/barkpark-schema)" ]; then echo 'BARKPARK_SCHEMA_SOURCE=fixtures' >> "$GITHUB_ENV"; echo 'fixture schemas changed: reading them from the checkout'; fi
      - name: .env from secrets
        run: env | grep '^BARKPARK_' > .env
      - name: Reset studio-parity to the fixture
        run: node --env-file=.env scripts/seed-barkpark.mjs --data
      - name: Build the studio (outside the suite's 60 s budget)
        run: pnpm --dir app build
      - name: Warm Chrome's first launch (cold start is runner disk, not the studio)
        working-directory: e2e
        run: |
          node --input-type=module -e "const {chromium} = await import('@playwright/test'); const b = await chromium.launch({channel: 'chrome'}); await (await b.newPage()).goto('about:blank'); await b.close()"
      - name: Start the studio (server boot is outside the budget too)
        run: |
          set -a; . ./.env; set +a
          STUDIO_E2E_HOOKS=1 STUDIO_SIGN_IN=shared nohup pnpm --dir app exec vite preview --port 3100 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/health > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1
      - name: Warm the studio's first page (its first Barkpark calls are outside the specs)
        # task-0fbe272a366541f4: a fresh studio server's first page logged its Barkpark calls at
        # ~3.2 s (all at once, every shard), while Barkpark's own log served them in 2-6 ms: the
        # cost is the runner's cold first round trip, not Barkpark. One page here takes it.
        run: |
          curl -s -o /dev/null -w 'first page %{http_code} in %{time_total}s\n' --max-time 30 http://localhost:3100/structure/post || true
          echo "preview.log lines before the specs: $(wc -l < preview.log)"
      - name: Journeys (ours)
        working-directory: e2e
        timeout-minutes: 4
        run: node --env-file=../.env node_modules/@playwright/test/cli.js test $(node ../scripts/shard-files.mjs ${{ matrix.shard }} 6) --project=studio
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          # preview.log: the studio server's own log ([listen] upstream drops, 429 retries).
          path: |
            e2e/test-results/
            e2e/journeys/*-snapshots/
            preview.log
          if-no-files-found: ignore
      - name: Free the dataset
        if: always()
        run: node scripts/ci-lease.mjs release
