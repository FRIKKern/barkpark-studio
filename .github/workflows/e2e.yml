# Our-side journey specs against Barkpark workspace studio-parity. The Sanity
# side of each spec stays local (needs a Sanity login). Budget: each shard < 60 s
# (aim for 45 s). Four shards on four runners, each with its own dataset (ci, ci-2,
# ci-3, ci-4), so the suite can grow without one 2-vCPU runner and one dataset becoming
# the bottleneck. Spec files go to shards by recorded CI time (scripts/shard-files.mjs,
# e2e/durations.json), so the heavy ones spread; re-record after a big change.
name: e2e
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  studio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, dataset: ci }
          - { shard: 2, dataset: ci-2 }
          - { shard: 3, dataset: ci-3 }
          - { shard: 4, dataset: ci-4 }
    concurrency:
      group: e2e-dataset-${{ matrix.dataset }} # one run per dataset at a time
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: 'true'
      BARKPARK_URL: https://guerrilla.barkpark.cloud
      BARKPARK_WORKSPACE: studio-parity
      BARKPARK_PROJECT: default
      BARKPARK_DATASET: ${{ matrix.dataset }} # GitHub's own datasets; local runs use e2e-*, people use production
      BARKPARK_TOKEN: ${{ secrets.BARKPARK_TOKEN }} # read/write, studio-parity only
      BUDGET_NETWORK_SCALE: '4' # runner is far from guerrilla; see e2e/rig/feel.ts
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile && pnpm --dir e2e install --frozen-lockfile
      # The studio reads the schemas from Barkpark, as in production (a member token may,
      # barkpark #22080). A PR that changes the fixture schemas tests them from the
      # checkout instead: ci / ci-2 / ci-3 / ci-4 only get them when someone reseeds (--schemas).
      - name: Schemas from the fixtures when this PR changes them
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          if [ -n "$(git diff --name-only FETCH_HEAD HEAD -- fixtures/barkpark-schema)" ]; then echo 'BARKPARK_SCHEMA_SOURCE=fixtures' >> "$GITHUB_ENV"; echo 'fixture schemas changed: reading them from the checkout'; fi
      - name: .env from secrets
        run: env | grep '^BARKPARK_' > .env
      - name: Reset studio-parity to the fixture
        run: node --env-file=.env scripts/seed-barkpark.mjs --data
      - name: Build the studio (outside the suite's 60 s budget)
        run: pnpm --dir app build
      - name: Warm Chrome's first launch (cold start is runner disk, not the studio)
        working-directory: e2e
        run: |
          node --input-type=module -e "const {chromium} = await import('@playwright/test'); const b = await chromium.launch({channel: 'chrome'}); await (await b.newPage()).goto('about:blank'); await b.close()"
      - name: Start the studio (server boot is outside the budget too)
        run: |
          set -a; . ./.env; set +a
          nohup pnpm --dir app exec vite preview --port 3100 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/health > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1
      - name: Journeys (ours)
        working-directory: e2e
        timeout-minutes: 4
        run: node --env-file=../.env node_modules/@playwright/test/cli.js test --project studio $(node ../scripts/shard-files.mjs ${{ matrix.shard }} 4)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            e2e/test-results/
            e2e/journeys/*-snapshots/
          if-no-files-found: ignore
