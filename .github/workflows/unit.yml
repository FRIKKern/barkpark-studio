name: unit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Typecheck and the unit tests (app/src/lib/*.test.ts): a required check on main.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      - uses: ./.github/actions/react-alpha
      - name: Typecheck
        run: pnpm --dir app exec tsc --noEmit
      - name: Unit tests
        run: pnpm --dir app test
      - name: PortableDoc conformance
        run: pnpm --dir app conformance
      # The desk rig's guards (e2e/rig/*.test.mjs): node only, loopback only, no .env. `ls` first:
      # node --test passes on a glob that matches nothing.
      - name: Rig guard tests
        run: |
          ls e2e/rig/*.test.mjs
          node --test e2e/rig/*.test.mjs
