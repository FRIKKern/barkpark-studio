name: docs
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Doc size caps and links
        run: node scripts/check-docs.mjs
      - name: Generators still run
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: node scripts/readme-timeline.mjs && node scripts/generate-roadmap.mjs && node scripts/check-docs.mjs
