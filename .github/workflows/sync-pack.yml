# Keeps conformance/pack/ the same as Barkpark main's api/priv/portable_doc, once a day and on demand.
# `plan` (no key, read-only token) compares, builds the sync commit and decides; `act` writes: it pushes
# that one commit to sync/barkpark-pack with the deploy key, opens or updates the PR, merges a green one
# or closes a leftover one.
# `act` trusts nothing `plan` hands it: `plan` ran install scripts, the renderer and Barkpark's
# conformance.mjs. It finds the sync PR itself, checks the bundle, the commit's parent and both sides of
# every changed path, and runs only git, gh, jq, sleep and shell built-ins (scripts/lib/workflow-keys.mjs,
# held by scripts/lib/sync-plan.test.mjs; its own cases in scripts/lib/sync-act.test.mjs).
# Why and how: docs/decisions/0009-pack-syncs-itself.md. To hold the sync back, disable this workflow.
name: sync-pack
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
permissions: {}
# One run at a time; a newer one waits for it (never cancels it mid-push).
concurrency:
  group: sync-pack
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, pull-requests: read, checks: read, statuses: read }
    env: { GH_TOKEN: '${{ github.token }}' }
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      # Barkpark is public: read with no token.
      - uses: actions/checkout@v5
        with:
          repository: FRIKKern/barkpark
          ref: main
          path: .barkpark
          sparse-checkout: api/priv/portable_doc
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # Conformance runs the studio renderer on the new pack.
      - name: Install the app
        run: pnpm --dir app install --frozen-lockfile
      - name: Plan (reads GitHub, writes nothing)
        id: plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/pack-sync-pr.mjs .barkpark --out "$RUNNER_TEMP/plan" --summary "$GITHUB_STEP_SUMMARY"
          echo "action=$(jq -r .action "$RUNNER_TEMP/plan/plan.json")" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.action != 'none'
        uses: actions/upload-artifact@v4
        with: { name: plan, path: '${{ runner.temp }}/plan', retention-days: 7 }

  # Installs and runs nothing from the repo: git, gh, jq, sleep and shell built-ins on the plan's files.
  act:
    needs: plan
    if: needs.plan.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, pull-requests: write }
    env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
    outputs:
      merged: ${{ steps.write.outputs.merged }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: plan, path: '${{ runner.temp }}/plan' }
      # The deploy key, for the push: a push by the workflow token starts no checks on the PR.
      - if: needs.plan.outputs.action == 'push'
        uses: actions/checkout@v5
        with: { fetch-depth: 0, ssh-key: '${{ secrets.HOUSEKEEPING_DEPLOY_KEY }}' }
      - name: Push, open or update, merge, or close
        id: write
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan"
          branch=sync/barkpark-pack
          re_sha='^[0-9a-f]{40}$'
          action=$(jq -r .action "$plan/plan.json")
          # The sync PR, found here: this repo's (not a fork's) open PR from sync/barkpark-pack into main.
          number=$(gh pr list --head "$branch" --base main --state open --json number,headRefName,baseRefName,isCrossRepository |
            jq -r --arg b "$branch" '[.[] | select((.isCrossRepository | not) and .headRefName == $b and .baseRefName == "main") | .number] | if length > 1 then "many" else (.[0] // "" | tostring) end')
          [ "$number" != many ] || { echo "::error::more than one sync PR is open"; exit 1; }
          asked=$(jq -r '.number // "" | tostring' "$plan/plan.json")
          [ "$asked" = "$number" ] || { echo "::error::the plan names #$asked; the sync PR is #${number:-none}"; exit 1; }
          case "$action" in
            close)
              [ -n "$number" ] || { echo "no sync PR open: nothing to close"; exit 0; }
              gh pr close "$number" --delete-branch --comment 'main already carries these files: nothing left to sync.'
              ;;
            land)
              [ -n "$number" ] || { echo "no sync PR open: nothing to land"; exit 0; }
              head=$(jq -r .head "$plan/plan.json")
              [[ $head =~ $re_sha ]] || { echo "::error::head $head"; exit 1; }
              for try in 1 2 3 4 5; do
                gh pr merge "$number" --squash --delete-branch --match-head-commit "$head" || true
                if [ "$(gh pr view "$number" --json state --jq .state)" = MERGED ]; then echo "merged=true" >> "$GITHUB_OUTPUT"; exit 0; fi
                sleep $((try * 5))
              done
              echo "::error::#$number is not merged after 5 tries"; exit 1
              ;;
            push)
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              main=$(jq -r .main "$plan/plan.json")
              [[ $main =~ $re_sha ]] || { echo "::error::main $main"; exit 1; }
              git fetch -q origin main
              git merge-base --is-ancestor "$main" origin/main || { echo "::error::$main is not on main"; exit 1; }
              lease=$(git ls-remote origin "refs/heads/$branch")
              lease=${lease%%[[:space:]]*}
              [ -z "$lease" ] || git fetch -q origin "$branch"
              if ! { [ -f "$plan/sync.bundle" ] && git bundle verify -q "$plan/sync.bundle"; }; then echo "::error::no valid sync.bundle"; exit 1; fi
              git fetch -q "$plan/sync.bundle" HEAD:refs/heads/sync
              # One commit. With the sync PR open: on its current head with that main merged in (git redoes
              # the merge to check it; none when the head holds that main), so a hand commit there stays.
              # Without: straight on that main.
              read -r _ base extra <<<"$(git rev-list --parents -n 1 sync)"
              if [ -z "$base" ] || [ -n "$extra" ]; then echo "::error::the sync commit is a merge"; exit 1; fi
              if [ -n "$number" ]; then
                read -r _ ours theirs more <<<"$(git rev-list --parents -n 1 "$base")"
                if [ "$base" = "$lease" ] && git merge-base --is-ancestor "$main" "$lease"; then
                  : # the PR's head already holds that main
                elif ! { [ "$ours" = "$lease" ] && [ "$theirs" = "$main" ] && [ -z "$more" ] && [ "$(git merge-tree --write-tree "$lease" "$main")" = "$(git rev-parse "$base^{tree}")" ]; }; then
                  echo "::error::the sync commit is not on #$number's head merged with main"; exit 1
                fi
              else
                [ "$base" = "$main" ] || { echo "::error::the sync commit is not on main"; exit 1; }
              fi
              # Every changed path, renames as a delete and an add, so both sides are seen: under the pack or
              # its report, a plain file (100644) before and after, no . or .. segment.
              re_path='^(conformance/pack/[^/].*|conformance/barkpark-studio\.json)$'
              re_dot='(^|/)\.\.?(/|$)'
              re_mode='^(100644|000000)$'
              bad=''
              while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
                read -r old new _ _ status <<<"${meta#:}"
                [[ $old =~ $re_mode && $new =~ $re_mode && $path =~ $re_path && ! $path =~ $re_dot ]] || bad+="$status $old $new $path; "
              done < <(git diff --no-renames --raw -z "$base" sync)
              [ -z "$bad" ] || { echo "::error::the sync commit changes what the pack never holds: $bad"; exit 1; }
              git push -q --force-with-lease="$branch:$lease" origin "sync:refs/heads/$branch"
              read -r title < "$plan/title.txt"
              if [ -n "$number" ]; then
                gh pr edit "$number" --title "$title" --body-file "$plan/body.md"
              else
                gh pr create --head "$branch" --base main --title "$title" --body-file "$plan/body.md" || {
                  echo "::error::The sync PR cannot be opened. Settings > Actions > General > \"Allow GitHub Actions to create and approve pull requests\" must be on."; exit 1; }
                # A PR the workflow token opens starts no checks; a push by the deploy key does.
                git switch -q sync
                git commit -q --allow-empty -m 'Start the checks'
                git push -q --force-with-lease="$branch:$(git rev-parse sync^)" origin "sync:refs/heads/$branch"
              fi
              ;;
            *) echo "::error::unknown action $action"; exit 1 ;;
          esac

  # A merge by the workflow token starts no push runs on main: ask for them.
  checks-on-main:
    needs: act
    if: needs.act.outputs.merged == 'true'
    runs-on: ubuntu-latest
    permissions: { actions: write }
    env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
    steps:
      - run: |
          gh workflow run unit.yml --ref main
          gh workflow run e2e.yml --ref main
