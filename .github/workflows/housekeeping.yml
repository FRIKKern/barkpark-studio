# Keeps the roadmap picture current, and the repo tidy. README's News is written
# by the daily news run (docs/decisions/0008-daily-news.md), never here.
# Why and how: docs/decisions/0003-tracking-and-hygiene.md
name: housekeeping
on:
  schedule:
    - cron: '17 4 * * *' # daily refresh
    - cron: '23 5 * * 1' # weekly hygiene, Mondays
  workflow_dispatch:
permissions: {}
# One housekeeping run at a time; a newer one waits for it (never cancels it mid-push).
concurrency:
  group: housekeeping
  cancel-in-progress: false
jobs:
  # Regenerates the roadmap with no key and a read-only token; hands the picture to `push`.
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Regenerate
        id: regen
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          node scripts/generate-roadmap.mjs
          node scripts/check-docs.mjs
          if git diff --quiet -- docs/images/roadmap.svg; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: roadmap, path: docs/images/roadmap.svg, retention-days: 7 }

  # main requires its checks (ruleset "main: required checks"); this push alone goes past them, with the
  # repo's housekeeping deploy key (the ruleset's only bypass). It runs main's scripts/housekeeping-push.sh,
  # which runs git and scripts/lib/svg-check.py; the job and those files are pinned in scripts/lib/keyed-jobs.json.
  push:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    env: { GH_REPO: '${{ github.repository }}' }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: roadmap, path: '${{ runner.temp }}/roadmap' }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Commit the picture on main and push it
        env: { DEPLOY_KEY: '${{ secrets.HOUSEKEEPING_DEPLOY_KEY }}' }
        run: bash scripts/housekeeping-push.sh

  # The workflow token may write here (delete branches, comment on PRs): pinned in scripts/lib/keyed-jobs.json.
  # It reaches only the gh steps; git reads the public repo with no credentials.
  hygiene:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 5 * * 1')
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    env: { GH_REPO: '${{ github.repository }}' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Delete merged branches left on the remote
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # Only a branch of this repo (no fork's PR) whose merged PR's head SHA is still its tip, looked up by
          # its full ref, with no open PR. A name outside [A-Za-z0-9._/-] never reaches the API (gh reads # ? { }
          # in a path): it is skipped and listed in the run summary for a person.
          open_heads=$(gh pr list --state open --limit 500 --json headRefName --jq '.[].headRefName')
          gh pr list --state merged --limit 200 --json headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select((.isCrossRepository | not) and .headRefName != "main") | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            case "$branch" in
              '' | *[!A-Za-z0-9._/-]*)
                echo "::warning::not deleting branch $branch: a name outside [A-Za-z0-9._/-]; delete it by hand if it is done"
                echo "- \`$branch\` merged but not deleted: its name is outside [A-Za-z0-9._/-]; delete it by hand" >> "$GITHUB_STEP_SUMMARY"
                continue ;;
            esac
            grep -qxF "$branch" <<<"$open_heads" && continue # an open PR still has it
            tip=$(git ls-remote origin "refs/heads/$branch" | awk -v ref="refs/heads/$branch" '$2 == ref { print $1 }')
            [ "$tip" = "$sha" ] || continue # gone, or reused with new commits
            echo "deleting merged branch $branch"
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" --silent
          done
      - name: Flag PRs and branches idle for 7+ days
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cutoff=$(date -u -d '7 days ago' +%s)
          gh pr list --state open --json number,updatedAt --jq '.[] | "\(.number) \(.updatedAt)"' |
          while read -r pr at; do
            [ "$(date -u -d "$at" +%s)" -lt "$cutoff" ] || continue
            gh pr comment "$pr" --body "Idle for 7+ days (weekly hygiene). Merge it, close it, or say what it waits for. See CONTRIBUTING.md."
          done
          open_heads=$(gh pr list --state open --json headRefName --jq '.[].headRefName')
          git fetch --prune origin
          git for-each-ref refs/remotes/origin --format='%(refname:lstrip=3) %(committerdate:unix)' |
          while read -r branch at; do
            case "$branch" in main|HEAD) continue ;; esac
            [ "$at" -lt "$cutoff" ] || continue
            grep -qx "$branch" <<<"$open_heads" && continue
            echo "::warning::branch $branch idle 7+ days with no open PR"
            echo "- \`$branch\` idle 7+ days, no open PR" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Doc size caps and links
        run: node scripts/check-docs.mjs
