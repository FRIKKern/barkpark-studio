# Keeps the roadmap picture current, and the repo tidy. README's News is written
# by the daily news run (docs/decisions/0008-daily-news.md), never here.
# Why and how: docs/decisions/0003-tracking-and-hygiene.md
name: housekeeping
on:
  schedule:
    - cron: '17 4 * * *' # daily refresh
    - cron: '23 5 * * 1' # weekly hygiene, Mondays
  workflow_dispatch:
permissions: {}
# One housekeeping run at a time; a newer one waits for it (never cancels it mid-push).
concurrency:
  group: housekeeping
  cancel-in-progress: false
jobs:
  # Regenerates the roadmap with no key and a read-only token; hands the picture to `push`.
  refresh:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
      base: ${{ steps.regen.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Regenerate
        id: regen
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          node scripts/generate-roadmap.mjs
          node scripts/check-docs.mjs
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- docs/images/roadmap.svg; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with: { name: roadmap, path: docs/images/roadmap.svg, retention-days: 7 }

  # main requires its checks (ruleset "main: required checks"); this push alone goes past them,
  # with the repo's housekeeping deploy key (the ruleset's only bypass). It runs git only.
  push:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: roadmap, path: '${{ runner.temp }}/roadmap' }
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.refresh.outputs.base }}', fetch-depth: 0, ssh-key: '${{ secrets.HOUSEKEEPING_DEPLOY_KEY }}' }
      # One file, committed on the main `refresh` read. If main moved, the commit is rebased onto it
      # (the picture may miss that move until the next run); a conflict fails the run, nothing pushed.
      - name: Commit the picture and push it to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$(git rev-parse HEAD) is not on main"; exit 1; }
          cp "$RUNNER_TEMP/roadmap/roadmap.svg" docs/images/roadmap.svg
          stray=$(git status --porcelain | grep -v ' docs/images/roadmap.svg$' || true)
          [ -z "$stray" ] || { echo "::error::more than the roadmap changed: $stray"; exit 1; }
          git add docs/images/roadmap.svg
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m 'chore: refresh roadmap [skip ci]'
          for try in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "::warning::push $try rejected (main moved): rebasing onto origin/main"
            sleep $((try * 5))
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::the roadmap conflicts with main; the next run regenerates it"; exit 1; }
          done
          echo "::error::main kept moving; 3 pushes rejected"
          exit 1

  hygiene:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 5 * * 1'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Delete merged branches left on the remote
        run: |
          gh pr list --state merged --limit 200 --json headRefName,headRefOid \
            --jq '.[] | select(.headRefName != "main") | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            tip=$(git ls-remote --heads origin "$branch" | cut -f1)
            [ "$tip" = "$sha" ] || continue # gone, or reused with new commits
            echo "deleting merged branch $branch"
            git push origin --delete "$branch"
          done
      - name: Flag PRs and branches idle for 7+ days
        run: |
          cutoff=$(date -u -d '7 days ago' +%s)
          gh pr list --state open --json number,updatedAt --jq '.[] | "\(.number) \(.updatedAt)"' |
          while read -r pr at; do
            [ "$(date -u -d "$at" +%s)" -lt "$cutoff" ] || continue
            gh pr comment "$pr" --body "Idle for 7+ days (weekly hygiene). Merge it, close it, or say what it waits for. See CONTRIBUTING.md."
          done
          open_heads=$(gh pr list --state open --json headRefName --jq '.[].headRefName')
          git fetch --prune origin
          git for-each-ref refs/remotes/origin --format='%(refname:lstrip=3) %(committerdate:unix)' |
          while read -r branch at; do
            case "$branch" in main|HEAD) continue ;; esac
            [ "$at" -lt "$cutoff" ] || continue
            grep -qx "$branch" <<<"$open_heads" && continue
            echo "::warning::branch $branch idle 7+ days with no open PR"
            echo "- \`$branch\` idle 7+ days, no open PR" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Doc size caps and links
        run: node scripts/check-docs.mjs
