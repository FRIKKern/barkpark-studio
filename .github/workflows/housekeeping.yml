# Keeps README's timeline and the roadmap picture current, and the repo tidy.
# Why and how: docs/decisions/0003-tracking-and-hygiene.md
name: housekeeping
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # daily refresh
    - cron: '23 5 * * 1' # weekly hygiene, Mondays
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
# One housekeeping run at a time; a newer one waits for it (never cancels it mid-push).
concurrency:
  group: housekeeping
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # main requires its checks (ruleset "main: required checks"); this push alone goes
      # past them, with the repo's housekeeping deploy key (the ruleset's only bypass).
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, ssh-key: '${{ secrets.HOUSEKEEPING_DEPLOY_KEY }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # Generated files are never merged by hand: each try starts from origin/main as it is
      # now, regenerates, and pushes; a push rejected because main moved meanwhile (a merge
      # landed, 2026-10-10 08:50: a README rebase conflict) starts over, at most 3 times.
      - name: Regenerate and push (from origin/main, retried if main moves)
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for try in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/readme-timeline.mjs
            node scripts/generate-roadmap.mjs
            node scripts/check-docs.mjs
            git add README.md docs/images/roadmap.svg
            git diff --cached --quiet && { echo "no change"; exit 0; }
            git commit -q -m 'chore: refresh README timeline and roadmap [skip ci]'
            git push origin HEAD:main && exit 0
            echo "::warning::push $try rejected (main moved): regenerating from origin/main"
            sleep $((try * 5))
          done
          echo "::error::main kept moving; 3 pushes rejected"
          exit 1

  hygiene:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 5 * * 1'
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Delete merged branches left on the remote
        run: |
          gh pr list --state merged --limit 200 --json headRefName,headRefOid \
            --jq '.[] | select(.headRefName != "main") | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            tip=$(git ls-remote --heads origin "$branch" | cut -f1)
            [ "$tip" = "$sha" ] || continue # gone, or reused with new commits
            echo "deleting merged branch $branch"
            git push origin --delete "$branch"
          done
      - name: Flag PRs and branches idle for 7+ days
        run: |
          cutoff=$(date -u -d '7 days ago' +%s)
          gh pr list --state open --json number,updatedAt --jq '.[] | "\(.number) \(.updatedAt)"' |
          while read -r pr at; do
            [ "$(date -u -d "$at" +%s)" -lt "$cutoff" ] || continue
            gh pr comment "$pr" --body "Idle for 7+ days (weekly hygiene). Merge it, close it, or say what it waits for. See CONTRIBUTING.md."
          done
          open_heads=$(gh pr list --state open --json headRefName --jq '.[].headRefName')
          git fetch --prune origin
          git for-each-ref refs/remotes/origin --format='%(refname:lstrip=3) %(committerdate:unix)' |
          while read -r branch at; do
            case "$branch" in main|HEAD) continue ;; esac
            [ "$at" -lt "$cutoff" ] || continue
            grep -qx "$branch" <<<"$open_heads" && continue
            echo "::warning::branch $branch idle 7+ days with no open PR"
            echo "- \`$branch\` idle 7+ days, no open PR" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Doc size caps and links
        run: node scripts/check-docs.mjs
